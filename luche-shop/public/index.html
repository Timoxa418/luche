<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Luche</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f2e9;
    --card: #fffdf8;
    --card-soft: #f1ecdf;
    --ink: #2e2a22;
    --muted: #8d8578;
    --line: #e9e1d3;
    --accent: #f2ca55;
    --accent-deep: #d9ad34;
    --accent-ink: #342b18;
    --sage: #a6ad91;
    --danger: #a85e4b;
    --radius: 21px;
    --shadow: 0 8px 26px rgba(74, 59, 31, .055);
    --shadow-lift: 0 14px 34px rgba(74, 59, 31, .10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 3px; }
  .hidden { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(246, 242, 233, .94);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    padding: 17px 18px 10px;
    border-bottom: 1px solid rgba(220, 211, 195, .55);
  }
  .header-top { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-logo {
    display: block;
    width: 134px;
    height: 34px;
    object-fit: contain;
    flex: none;
  }
  .cartbar { flex: none; }
  .cart-button {
    min-height: 47px; padding: 6px 11px 6px 7px; display: flex; align-items: center; gap: 9px;
    border: 1px solid #e8dfce; border-radius: 15px; background: rgba(255,253,248,.92);
    box-shadow: 0 4px 14px rgba(74, 59, 31, .045); transition: transform .16s, border-color .16s;
  }
  .cart-button:active { transform: scale(.97); }
  .cart-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: #f7edcf; color: #947027; position: relative; flex: none; }
  .cart-icon svg { width: 19px; height: 19px; display: block; }
  .cart-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; white-space: nowrap; }
  .cart-title { font-size: 11px; font-weight: 700; line-height: 1.1; color: var(--ink); }
  .cart-count { font-size: 9px; color: var(--muted); line-height: 1.1; }
  .cart-total { font-size: 11px; font-weight: 700; color: #9a7728; padding-left: 5px; white-space: nowrap; }
  @media (max-width: 360px) { .brand-logo { width: 112px; height: 29px; } header { padding-left: 13px; padding-right: 13px; } .header-top { gap: 7px; } .brand { gap: 8px; } .cart-button { padding-right: 8px; gap: 7px; } .cart-total { padding-left: 2px; } }
  .search {
    max-width: 1080px; margin: 16px auto 0;
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 15px;
    padding: 12px 15px; box-shadow: 0 3px 12px rgba(74, 59, 31, .025);
    color: #9a907f;
  }
  .search input {
    flex: 1; border: 0; background: none; outline: none; font: inherit;
    color: var(--ink); min-width: 0; font-size: 14px;
  }
  .search input::placeholder { color: #aaa193; }
  .chips {
    max-width: 1080px; margin: 0 auto; display: flex; gap: 8px;
    overflow-x: auto; padding: 13px 0 4px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 9px 15px; border-radius: 999px;
    background: rgba(255,253,248,.72); color: #726b60;
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    border: 1px solid var(--line); transition: background .18s, color .18s, border-color .18s;
  }
  .chip.on { background: var(--ink); color: #fffdf8; border-color: var(--ink); }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 13px;
    padding: 12px 16px 20px; max-width: 1112px; margin: 0 auto;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 18px 22px 28px; } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .item {
    min-width: 0; padding: 0; background: var(--card); border: 1px solid rgba(229, 220, 204, .8);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    text-align: left; display: flex; flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  @media (hover: hover) { .item:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: #dfd3bd; } }
  .ph {
    aspect-ratio: 3/4; background: linear-gradient(160deg, var(--c1), var(--c2));
    position: relative; display: flex; align-items: center; justify-content: center;
    font-size: 40px; overflow: hidden;
  }
  .ph img { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
  @media (hover: hover) { .item:hover .ph img { transform: scale(1.035); } }
  .badge {
    position: absolute; z-index: 2; top: 10px; left: 10px;
    background: rgba(57, 65, 49, .92); color: #fffdf7; font-size: 10px;
    font-weight: 700; letter-spacing: .04em; padding: 6px 9px; border-radius: 999px;
  }
  .meta { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .price { font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
  .price s { color: #a69d8e; font-weight: 400; font-size: 11px; margin-left: 6px; }
  .name {
    font-size: 12px; color: #6f685d; line-height: 1.45; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { text-align: center; color: var(--muted); padding: 64px 24px; font-size: 14px; }

  /* Кнопка корзины находится в верхней панели рядом с логотипом */
  .btn {
    width: 100%; padding: 16px 19px; border-radius: 16px;
    background: linear-gradient(135deg, #f7d66e, #edc14a); color: var(--accent-ink);
    font-weight: 700; font-size: 14px; letter-spacing: .01em;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 8px 22px rgba(198, 153, 43, .22); transition: transform .16s, filter .16s;
  }
  .btn:active { transform: scale(.985); filter: brightness(.98); }
  .btn.alt { background: var(--ink); color: #fffdf8; box-shadow: none; justify-content: center; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Модальные окна */
  .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(36, 31, 23, .46); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .panel {
    background: var(--bg); width: 100%; max-height: 92vh; border-radius: 27px 27px 0 0;
    overflow-y: auto; position: relative; animation: up .24s ease-out;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(35, 29, 19, .12);
  }
  @media (min-width: 640px) { .sheet { align-items: center; justify-content: center; padding: 24px; } .panel { max-width: 520px; border-radius: 27px; } }
  @keyframes up { from { transform: translateY(36px); opacity: .5; } to { transform: none; opacity: 1; } }
  .close {
    position: absolute; top: 13px; right: 13px; z-index: 3; width: 37px; height: 37px;
    border-radius: 50%; background: rgba(255,253,248,.94); color: #655d50;
    box-shadow: 0 3px 12px rgba(45, 36, 22, .10); font-size: 16px;
  }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery .ph { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 1/1.1; border-radius: 0; font-size: 68px; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #dcd3c4; }
  .dots i.on { width: 18px; border-radius: 99px; background: var(--accent-deep); }
  .body { padding: 15px 20px 5px; }
  .body h2 { margin: 6px 0; font: 600 23px/1.25 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
  .brandline { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .bigprice { font-size: 24px; font-weight: 700; margin: 10px 0 16px; letter-spacing: -.03em; }
  .bigprice s { color: #a69d8e; font-size: 14px; font-weight: 400; margin-left: 8px; }
  .label { font-size: 11px; color: var(--muted); margin: 17px 0 9px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .size {
    min-width: 48px; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: #615a4f; font-size: 13px; font-weight: 600;
  }
  .size.on { border-color: var(--accent-deep); background: #f8e9b8; color: #5f4918; }
  .size.off { opacity: .38; text-decoration: line-through; pointer-events: none; }
  .desc { font-size: 13px; line-height: 1.65; white-space: pre-line; color: #615a50; }
  .attrs { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 12px; margin-top: 4px; }
  .attrs span:nth-child(odd) { color: var(--muted); }
  .actions { padding: 13px 20px 4px; position: sticky; bottom: 0; background: var(--bg); box-shadow: 0 -8px 16px -8px rgba(74, 59, 31, .10); }
  .hint { color: var(--danger); font-size: 12px; min-height: 18px; padding: 0 20px; line-height: 1.45; }

  /* Корзина */
  .cart-head { padding: 23px 20px 8px; font: 600 25px/1.2 Georgia, "Times New Roman", serif; }
  .line { display: flex; gap: 12px; padding: 13px 20px; align-items: center; border-bottom: 1px solid rgba(225,216,201,.62); }
  .line .ph { width: 67px; flex: none; aspect-ratio: 3/4; border-radius: 13px; font-size: 22px; }
  .line .info { flex: 1; min-width: 0; }
  .line .t { font-size: 13px; line-height: 1.4; font-weight: 600; }
  .line .s { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .line .p { font-weight: 700; font-size: 13px; margin-top: 5px; }
  .qty { display: flex; align-items: center; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .qty button { width: 29px; height: 29px; border-radius: 9px; font-size: 17px; font-weight: 600; color: #625a4d; }
  .qty span { min-width: 21px; text-align: center; font-size: 12px; font-weight: 700; }
  .sum { padding: 10px 20px; font-size: 13px; color: #70695e; }
  .sum div { display: flex; justify-content: space-between; padding: 5px 0; }
  .sum .tot { color: var(--ink); font-size: 17px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 7px; padding-top: 12px; }
  .note { padding: 0 20px; color: var(--muted); font-size: 11px; line-height: 1.55; }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    background: #302c24; color: #fffdf8; padding: 11px 17px; border-radius: 13px;
    z-index: 30; font-size: 13px; max-width: 90vw; text-align: center;
    box-shadow: 0 8px 24px rgba(28, 24, 18, .18);
  }
  .success { text-align: center; padding: 42px 24px; }
  .success .big { font-size: 56px; }
  .success h2 { font: 600 25px Georgia, "Times New Roman", serif; }
  .success p { color: var(--muted); font-size: 13px; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>
</head>

<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#f6f2e9'); tg.setBackgroundColor('#f6f2e9'); } catch (e) {} }

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₽';

  const state = { products: [], category: 'Все', query: '', cart: [], config: { shippingCost: 0, freeShippingFrom: 0 }, view: null };

  // ---- корзина в памяти телефона ----
  try { state.cart = JSON.parse(localStorage.getItem('luche_cart') || '[]'); } catch (e) { state.cart = []; }
  const saveCart = () => { try { localStorage.setItem('luche_cart', JSON.stringify(state.cart)); } catch (e) {} };

  // ---- мягкие цвета для товаров без фото ----
  const PALETTE = [['#ffe3a3', '#ffc971'], ['#d8e8d2', '#aecdaa'], ['#f9d5c6', '#f2ac95'], ['#d9e2f2', '#b4c6e6'], ['#eddcf2', '#d4b4e0']];
  const EMOJI = { 'Боди': '🍼', 'Худи': '🧥', 'Комбинезоны': '🧸', 'Футболки': '👕', 'Шапки': '🧢', 'Штаны': '👖' };
  const pal = (p) => PALETTE[Number(String(p.id).slice(-3)) % PALETTE.length];
  const emoji = (p) => EMOJI[p.category] || '🌤';

  function phHtml(p, imgIdx = 0, extra = '') {
    const [c1, c2] = pal(p);
    const img = p.images && p.images[imgIdx];
    return `<div class="ph" style="--c1:${c1};--c2:${c2}">${img ? `<img loading="lazy" src="${esc(img)}" alt="" onerror="this.remove()">` : ''}<span>${emoji(p)}</span>${extra}</div>`;
  }

  // ---- загрузка ----
  async function init() {
    try {
     const [prod, cfg] = await Promise.all([
  fetch('products.json?v=' + Date.now(), { cache: 'no-cache' }).then((r) => r.json()),
  fetch('api/config').then((r) => r.json()).catch(() => ({})),
]);
      state.products = prod.products || [];
      Object.assign(state.config, cfg);
      if (cfg.shopName) { $('shopName').textContent = cfg.shopName; document.title = cfg.shopName; }
    } catch (e) {
      $('grid').innerHTML = '';
      $('empty').textContent = 'Не удалось загрузить каталог. Проверьте интернет и откройте снова.';
      $('empty').classList.remove('hidden');
      return;
    }
    // убираем из корзины то, чего уже нет в каталоге
    state.cart = state.cart.filter((l) => state.products.some((p) => p.id === l.id));
    renderChips();
    renderGrid();
    renderCartBar();
  }

  function renderChips() {
    const cats = ['Все', ...new Set(state.products.map((p) => p.category))];
    $('chips').innerHTML = cats.map((c) => `<button class="chip ${c === state.category ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  }

  function filtered() {
    const q = state.query.trim().toLowerCase();
    return state.products.filter((p) =>
      (state.category === 'Все' || p.category === state.category) &&
      (!q || (p.title + ' ' + p.category + ' ' + p.sku + ' ' + p.brand).toLowerCase().includes(q)));
  }

  function renderGrid() {
    const list = filtered();
    $('empty').classList.toggle('hidden', list.length > 0);
    $('empty').textContent = 'Ничего не нашли. Попробуйте изменить запрос 🌤';
    $('grid').innerHTML = list.map((p) => {
      const off = p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
      return `<button class="item" data-id="${esc(p.id)}">
        ${phHtml(p, 0, off ? `<span class="badge">−${off}%</span>` : '')}
        <div class="meta"><div class="price">${fmt(p.price)}${off ? `<s>${fmt(p.oldPrice)}</s>` : ''}</div><div class="name">${esc(p.title)}</div></div>
      </button>`;
    }).join('');
  }

  // ---- корзина: расчёты ----
  const find = (id) => state.products.find((p) => p.id === id);
  const count = () => state.cart.reduce((s, l) => s + l.qty, 0);
  const subtotal = () => state.cart.reduce((s, l) => s + (find(l.id)?.price || 0) * l.qty, 0);
  function shipping() {
    const { shippingCost, freeShippingFrom } = state.config;
    if (!shippingCost) return 0;
    return freeShippingFrom && subtotal() >= freeShippingFrom ? 0 : shippingCost;
  }
  const plural = (n, a, b, c) => { const m = n % 100, d = n % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; };

  function renderCartBar() {
    const n = count();
    $('cartbar').classList.toggle('hidden', state.view === 'cart' || state.view === 'product');
    $('cbCount').textContent = n ? `${n} ${plural(n, 'товар', 'товара', 'товаров')}` : 'Пока пуста';
    $('cbTotal').textContent = fmt(subtotal());
    $('openCart').setAttribute('aria-label', n ? `Корзина: ${n} ${plural(n, 'товар', 'товара', 'товаров')}, ${fmt(subtotal())}` : 'Корзина пуста');
  }

  function addToCart(id, size) {
    const l = state.cart.find((x) => x.id === id && x.size === size);
    if (l) l.qty = Math.min(20, l.qty + 1); else state.cart.push({ id, size, qty: 1 });
    saveCart();
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }

  // ---- окна ----
  function openSheet(html, view) {
    state.view = view;
    $('panel').innerHTML = html;
    $('sheet').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    $('panel').scrollTop = 0;
    renderCartBar();
    if (tg && tg.BackButton) try { tg.BackButton.show(); } catch (e) {}
  }
  function closeSheet() {
    state.view = null;
    $('sheet').classList.add('hidden');
    document.body.style.overflow = '';
    renderCartBar();
    if (tg && tg.BackButton) try { tg.BackButton.hide(); } catch (e) {}
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ---- карточка товара ----
 // ---- карточка товара ----
  function openProduct(id) {
    const p = find(id);
    if (!p) return;
    let size = null;
    const imgs = p.images && p.images.length ? p.images : [null];
    const off = p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    const anyAvailable = p.sizes.some((s) => s.available);

    // Формируем кнопки размеров с учётом FBS-остатков
    const sizesHtml = p.sizes.map((s) => {
      const stockText = s.stock !== undefined ? (s.stock > 0 ? ` (${s.stock} шт.)` : ' (нет)') : '';
      return `<button class="size ${s.available ? '' : 'off'}" data-size="${esc(s.size)}">${esc(s.size)}${stockText}</button>`;
    }).join('');

    const html = `
      <button class="close" data-act="close" aria-label="Закрыть">✕</button>
      <div class="gallery" id="gal">${imgs.map((_, i) => phHtml(p, i)).join('')}</div>
      ${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      <div class="body">
        ${p.brand ? `<div class="brandline">${esc(p.brand)}${p.sku ? ' · ' + esc(p.sku) : ''}</div>` : ''}
        <h2>${esc(p.title)}</h2>
        <div class="bigprice">${fmt(p.price)}${off ? `<s>${fmt(p.oldPrice)}</s>` : ''}</div>
        <div class="label">Размер</div>
        <div class="sizes" id="sizes">${sizesHtml}</div>
        ${p.description ? `<div class="label">Описание</div><div class="desc">${esc(p.description)}</div>` : ''}
        ${p.attrs && p.attrs.length ? `<div class="label">Характеристики</div><div class="attrs">${p.attrs.map((a) => `<span>${esc(a.name)}</span><span>${esc(a.value)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="hint" id="hint"></div>
      <div class="actions"><button class="btn alt" id="addBtn" ${anyAvailable ? '' : 'disabled'}>${anyAvailable ? 'В корзину' : 'Нет в наличии'}</button></div>`;
    openSheet(html, 'product');

    const sizesEl = $('sizes');
    const available = p.sizes.filter((s) => s.available);
    if (available.length === 1) { size = available[0].size; sizesEl.querySelector(`[data-size="${CSS.escape(size)}"]`)?.classList.add('on'); }
    sizesEl.onclick = (e) => {
      const b = e.target.closest('.size'); if (!b || b.classList.contains('off')) return;
      size = b.dataset.size;
      sizesEl.querySelectorAll('.size').forEach((x) => x.classList.toggle('on', x === b));
      $('hint').textContent = '';
    };
    const gal = $('gal');
    if ($('dots')) gal.onscroll = () => {
      const i = Math.round(gal.scrollLeft / gal.clientWidth);
      $('dots').querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
    };
    $('addBtn').onclick = () => {
      if (!size) { $('hint').textContent = 'Выберите размер'; return; }
      addToCart(p.id, size);
      toast('Добавлено в корзину');
      closeSheet();
    };
  }

  // ---- корзина ----
  function openCart() {
    if (!state.cart.length) {
      openSheet(`
        <button class="close" data-act="close" aria-label="Закрыть">✕</button>
        <div class="cart-head">Корзина</div>
        <div class="empty-cart" style="padding:34px 24px 38px;text-align:center">
          <div style="font-size:42px;color:#c49a30;margin-bottom:10px">♡</div>
          <div style="font:600 22px/1.2 'Cormorant Garamond',Georgia,serif">Здесь пока пусто</div>
          <p style="font-size:13px;line-height:1.6;color:var(--muted);margin:8px 0 22px">Добавьте понравившиеся вещи, и они появятся здесь.</p>
          <button class="btn alt" data-act="close">Перейти к покупкам</button>
        </div>`, 'cart');
      return;
    }
    const lines = state.cart.map((l, i) => {
      const p = find(l.id); if (!p) return '';
      return `<div class="line">
        ${phHtml(p, 0)}
        <div class="info"><div class="t">${esc(p.title)}</div><div class="s">Размер ${esc(l.size)}</div><div class="p">${fmt(p.price * l.qty)}</div></div>
        <div class="qty"><button data-q="-1" data-i="${i}">−</button><span>${l.qty}</span><button data-q="1" data-i="${i}">+</button></div>
      </div>`;
    }).join('');
    const ship = shipping();
    const { freeShippingFrom, shippingCost } = state.config;
    const left = shippingCost && freeShippingFrom && ship ? freeShippingFrom - subtotal() : 0;
    openSheet(`
      <button class="close" data-act="close" aria-label="Закрыть">✕</button>
      <div class="cart-head">Корзина</div>
      ${lines}
      <div class="sum">
        <div><span>Товары</span><span>${fmt(subtotal())}</span></div>
        <div><span>Доставка</span><span>${ship ? fmt(ship) : 'бесплатно'}</span></div>
        <div class="tot"><span>Итого</span><span>${fmt(subtotal() + ship)}</span></div>
      </div>
      ${left > 0 ? `<div class="note">До бесплатной доставки осталось ${fmt(left)}</div>` : ''}
      <div class="note" style="margin-top:8px">Имя, телефон и адрес доставки вы укажете на следующем шаге в окне оплаты Telegram.</div>
      <div class="hint" id="hint"></div>
      <div class="actions"><button class="btn" id="payBtn"><span>Оплатить</span><span>${fmt(subtotal() + ship)}</span></button></div>`, 'cart');
    $('payBtn').onclick = pay;
  }

  async function pay() {
    const btn = $('payBtn');
    btn.disabled = true;
    $('hint').textContent = '';
    try {
      const res = await fetch('api/invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg ? tg.initData : '', items: state.cart }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Не удалось создать заказ');

      if (data.dev) { // проверка без Telegram
        $('hint').style.color = 'var(--muted)';
        $('hint').textContent = `Тестовый режим: заказ №${data.order.id} на ${fmt(data.order.total)} собран. Оплата работает только внутри Telegram.`;
        btn.disabled = false;
        return;
      }
      if (!tg || !tg.openInvoice) throw new Error('Откройте магазин в Telegram, чтобы оплатить');
      tg.openInvoice(data.link, (status) => {
        btn.disabled = false;
        if (status === 'paid') {
          state.cart = []; saveCart();
          openSheet(`<div class="success"><div class="big">💛</div><h2>Спасибо за заказ!</h2><p>Оплата прошла. Мы свяжемся с вами по поводу доставки.</p><div class="actions" style="padding:16px 0 0"><button class="btn alt" data-act="close">Вернуться в каталог</button></div></div>`, 'done');
        } else if (status === 'failed') {
          $('hint').textContent = 'Оплата не прошла. Попробуйте ещё раз.';
        } // cancelled / pending — ничего не делаем
      });
    } catch (e) {
      $('hint').textContent = e.message;
      btn.disabled = false;
    }
  }

  // ---- события ----
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.category = b.dataset.cat; renderChips(); renderGrid();
  });
  let t;
  $('q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.query = e.target.value; renderGrid(); }, 150); });
  $('grid').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) openProduct(b.dataset.id); });
  $('openCart').addEventListener('click', openCart);
  $('sheet').addEventListener('click', (e) => {
    if (e.target === $('sheet') || e.target.closest('[data-act="close"]')) { closeSheet(); return; }
    const q = e.target.closest('[data-q]');
    if (q) {
      const l = state.cart[Number(q.dataset.i)]; if (!l) return;
      l.qty += Number(q.dataset.q);
      if (l.qty <= 0) state.cart.splice(Number(q.dataset.i), 1);
      l.qty = Math.min(20, l.qty);
      saveCart();
      if (!state.cart.length) closeSheet(); else openCart();
    }
  });
  if (tg && tg.BackButton) try { tg.BackButton.onClick(closeSheet); } catch (e) {}

  init();
})();
</script>
</body>
</html>
